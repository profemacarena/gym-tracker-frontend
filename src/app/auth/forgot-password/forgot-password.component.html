<header
  class="sticky top-0 left-0 w-full bg-teal-950 bg-opacity-0 transition duration-300 shadow-md z-50"
>
  <nav class="w-full flex items-center justify-center px-6 py-4 relative">
    <a href="/">
      <img src="favicon.png" alt="" width="50px" />
    </a>
  </nav>
</header>
<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="max-w-md mx-auto space-y-6 p-6 bg-white shadow rounded mt-10">
    <h2 class="text-xl font-semibold text-center">¿Has olvidado tu contraseña?</h2>
  
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
      <input
        type="email"
        formControlName="email"
        placeholder="tucorreo@ejemplo.com"
        class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-md"
      />
      <div *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" class="text-sm text-red-500 mt-1">
        <span *ngIf="forgotForm.get('email')?.errors?.['required']">El correo es obligatorio.</span>
        <span *ngIf="forgotForm.get('email')?.errors?.['email']">Correo inválido.</span>
      </div>
    </div>
  
    <button
      type="submit"
      class="w-full bg-teal-600 text-white py-2 rounded hover:bg-teal-700 transition"
      [disabled]="forgotForm.invalid"
    >
      Enviar enlace
    </button>
  
    <div *ngIf="successMsg" class="text-green-600 text-sm mt-2">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="text-red-600 text-sm mt-2">{{ errorMsg }}</div>
  </form>
