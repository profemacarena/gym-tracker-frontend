<header class="sticky top-0 left-0 w-full bg-teal-950 bg-opacity-0 transition duration-300 shadow-md z-50">
    <nav class="w-full flex items-center justify-center px-6 py-4 relative">
      <a href="/">
        <img src="favicon.png" alt="" width="50px">
      </a>
    </nav>
  </header>
  
  <div class="pt-10 flex justify-center mx-auto">
    <p class="text-2xl font-bold text-teal-500">Regístrate en GymTracker</p>
  </div>
  <div class="h-screen flex justify-center mx-auto mt-5">
    <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()" class="form flex flex-col space-y-4 w-full max-w-md">
      <span class="input-span">
        <label for="name" class="label block text-gray-700">Nombre</label>
        <input
          type="text"
          formControlName="name"
          class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </span>
      <span class="input-span">
        <label for="email" class="label block text-gray-700">Correo electrónico</label>
        <input
          type="email"
          formControlName="email"
          class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </span>
      <span class="input-span">
        <label for="password" class="label block text-gray-700">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </span>
      <span class="input-span">
        <label for="passwordConfirm" class="label block text-gray-700">Confirmar contraseña</label>
        <input
          type="password"
          formControlName="passwordConfirm"
          class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </span>
      <input
        class="submit text-white p-2 rounded-md hover:bg-teal-700 transition duration-300 cursor-pointer"
        type="submit"
        value="Registrarse"
      />
      <span class="span text-white">
        ¿Ya tienes cuenta? <a href="/auth/login" class="text-teal-600 hover:underline">Inicia sesión</a>
      </span>
    </form>
  </div>
