<header
  class="sticky top-0 left-0 w-full bg-teal-950 bg-opacity-0 transition duration-300 shadow-md z-50"
>
  <nav class="w-full flex items-center justify-center px-6 py-4 relative">
    <a href="/">
      <img src="favicon.png" alt="" width="50px" />
    </a>
  </nav>
</header>

<form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="max-w-md mx-auto space-y-6 p-6 bg-white shadow rounded mt-10">
    <h2 class="text-xl font-semibold text-center">Restablecer contraseña</h2>
  
    <div>
      <label for="email" class="block text-sm">Correo electrónico</label>
      <input type="email" formControlName="email" class="w-full px-4 py-2 border rounded" />
    </div>
  
    <div>
      <label for="password" class="block text-sm">Nueva contraseña</label>
      <input type="password" formControlName="password" class="w-full px-4 py-2 border rounded" />
    </div>
  
    <div>
      <label for="password_confirmation" class="block text-sm">Confirmar contraseña</label>
      <input type="password" formControlName="password_confirmation" class="w-full px-4 py-2 border rounded" />
    </div>
  
    <button
      type="submit"
      class="w-full bg-teal-600 text-white py-2 rounded hover:bg-teal-700 transition"
      [disabled]="resetForm.invalid"
    >
      Guardar nueva contraseña
    </button>
  
    <div *ngIf="successMsg" class="text-green-600 text-sm mt-2">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="text-red-600 text-sm mt-2">{{ errorMsg }}</div>
  </form>
