<!-- Estos estilos son para que el footer se quede abajo en la pantalla, el contenido crecerá hacia abajo dejando siempre el footer abajo -->
<div class="flex flex-col min-h-screen"> 
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>


<div id="confirmation-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center backdrop-blur-sm bg-teal-950/30">
  <div class="bg-teal-900 w-full max-w-xl mx-4 rounded-2xl shadow-xl p-6 relative border border-teal-700">
    <p id="modal-message" class="text-teal-100 font-medium text-lg mb-4">¿Estás seguro de que quieres continuar?</p>
    
    <div class="flex justify-around">
      <button id="confirm-button" class="bg-teal-500 text-teal-100 px-4 py-2 rounded-md">Confirmar</button>
      <button id="cancel-button" class="bg-teal-500 text-teal-100 px-4 py-2 rounded-md">Cancelar</button>
    </div>
  </div>
</div>
